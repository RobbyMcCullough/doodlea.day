    <script>
      (() => {
        const compositionId = "01-cowboy-hat-origin";
        const root = document.querySelector('[data-composition-id="01-cowboy-hat-origin"]');
        const outer = root.querySelector("#f01-camera-outer");
        const inner = root.querySelector("#f01-camera-inner");
        const focus = root.querySelector("#f01-hat-focus");
        const brimPath = root.querySelector("#f01-brim-wipe-path");
        const underlinePath = root.querySelector("#f01-hat-underline-path");

        const rootRect = root.getBoundingClientRect();
        const focusRect = focus.getBoundingClientRect();
        const offsetX = focusRect.left + focusRect.width / 2 - (rootRect.left + rootRect.width / 2);
        const offsetY = focusRect.top + focusRect.height / 2 - (rootRect.top + rootRect.height / 2);
        const maxScale = Math.min(
          (0.88 * rootRect.width) / focusRect.width,
          (0.88 * rootRect.height) / focusRect.height,
        );
        const openingScale = Math.min(3.45, maxScale);
        const counterX = -offsetX;
        const counterY = -offsetY;

        const brimLength = brimPath.getTotalLength();
        const underlineLength = underlinePath.getTotalLength();
        gsap.set(brimPath, { strokeDasharray: brimLength, strokeDashoffset: brimLength });
        gsap.set(underlinePath, { strokeDasharray: underlineLength, strokeDashoffset: underlineLength });

        const tl = gsap.timeline({ paused: true });

        tl.fromTo(
          outer,
          { scale: openingScale },
          { scale: 1, duration: 2.5, ease: "power3.out" },
          1.3,
        );
        tl.fromTo(
          inner,
          { x: counterX, y: counterY },
          { x: 0, y: 0, duration: 2.5, ease: "power3.out" },
          1.3,
        );

        tl.fromTo(
          brimPath,
          { strokeDashoffset: brimLength },
          { strokeDashoffset: 0, duration: 0.82, ease: "power1.inOut" },
          0.14,
        );

        const copyEntries = [
          { selector: "#f01-label", text: "THE BEGINNING", base: 0.22, perCharacter: 0.01 },
          { selector: "#f01-headline", text: "I needed to draw a cowboy hat.", base: 0.32, perCharacter: 0.008 },
        ];
        let copyCursor = 3.8;
        copyEntries.forEach((entry) => {
          const duration = Math.min(0.62, entry.base + entry.text.length * entry.perCharacter);
          tl.fromTo(
            entry.selector,
            { yPercent: 112, opacity: 0 },
            { yPercent: 0, opacity: 1, duration, ease: "power3.out" },
            copyCursor,
          );
          copyCursor += Math.max(0.38, duration * 0.72);
        });

        tl.fromTo(
          "#f01-sub",
          { yPercent: 112, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
          5.2,
        );
        tl.fromTo(
          underlinePath,
          { strokeDashoffset: underlineLength },
          { strokeDashoffset: 0, duration: 0.7, ease: "power1.inOut" },
          5.32,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines[compositionId] = tl;
      })();
